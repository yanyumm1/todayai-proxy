name: 自动刷新 today.ai Cookie

on:
  schedule:
    # session 有效期约 59 天，保险起见每月 1 号和 15 号各刷一次（UTC 03:00 = 北京 11:00）
    - cron: "0 3 1,15 * *"
  workflow_dispatch:  # 也可手动触发

permissions:
  contents: read

jobs:
  refresh-cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行 cookie 刷新（IMAP 自动抓码 → 登录 → 写 Worker → 验证）
        env:
          TODAYAI_EMAIL: ${{ secrets.TODAYAI_EMAIL }}
          TODAYAI_IMAP_HOST: ${{ secrets.TODAYAI_IMAP_HOST }}
          TODAYAI_IMAP_USER: ${{ secrets.TODAYAI_IMAP_USER }}
          TODAYAI_IMAP_PASS: ${{ secrets.TODAYAI_IMAP_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
        run: |
          python3 update_worker_cookie.py \
            --email "${TODAYAI_EMAIL}" \
            --imap-host "${TODAYAI_IMAP_HOST}" \
            --imap-user "${TODAYAI_IMAP_USER}" \
            --imap-pass "${TODAYAI_IMAP_PASS}" \
            --non-interactive --json --verify

      - name: 结果通知（取 JSON 里的关键字段）
        if: always()
        run: |
          echo "::notice::cookie 刷新任务已结束（exit=$?），详情见上方 JSON 输出"